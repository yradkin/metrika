<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<title>Метрика</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Forum&display=swap">
<style>[hidden]{display:none!important}</style>
</head>
<body>
<style>
/* Layout: мобильное мини-приложение — шапка, экран, плавающий таб-бар; карточки подрядчиков открываются полноэкранным стеклянным листом. Стиль: liquid glass на перламутровой «ауре» — полупрозрачные слои с размытием, блик сверху, радужная кромка; золото — для отметок «в договоре». */
:root{
  --bg:#eef5f5; --tint:rgba(243,249,249,.86); --surface:rgba(255,255,255,.42); --surface-2:rgba(255,255,255,.44); --field:rgba(255,255,255,.62);
  --line:rgba(20,70,80,.10); --line-2:rgba(20,70,80,.20); --glass-brd:rgba(255,255,255,.78); --spec:rgba(255,255,255,.95);
  --sheen:linear-gradient(140deg,rgba(255,255,255,.62) 0%,rgba(255,255,255,.14) 34%,rgba(255,255,255,0) 60%);
  --iris:conic-gradient(from 210deg,#c9f5ea,#cfdcff,#f6d6ee,#d4f1ff,#fff2cf,#c9f5ea);
  --pearl:linear-gradient(118deg,#d9f6ef 0%,#e2e6fd 30%,#f8e4f1 58%,#dcf2fb 82%,#d9f6ef 100%);
  --ink-grad:linear-gradient(118deg,#0e3a44 0%,#17696d 52%,#2c4c88 100%);
  --num-grad:linear-gradient(100deg,#0f6f73 0%,#3a5ab2 55%,#7a3c8f 100%);
  --txt:#122026; --txt-2:rgba(18,32,38,.72); --txt-3:rgba(18,32,38,.52);
  --accent:#0f6f73; --accent-2:#5bb8b0; --accent-soft:rgba(15,111,115,.10); --accent-ink:#0b5357; --on-accent:#ffffff;
  --gold:#9a7424; --gold-soft:rgba(176,136,48,.16);
  --good:#1a8758; --good-soft:rgba(26,135,88,.13); --warn:#a96d12; --warn-soft:rgba(210,150,40,.17); --crit:#c03550; --crit-soft:rgba(192,53,80,.12);
  --hero-txt:#0e2a30;
  --aura-1:#a9eedd; --aura-2:#c3cfff; --aura-3:#f3c6e4; --aura-4:#c5ecff; --aura-5:#fff0bf; --aura-o:.95;
  --shadow:0 1px 1px rgba(20,70,80,.04),0 14px 34px -18px rgba(20,80,100,.35);
  --r:24px; --r-sm:14px;
  --f:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;
  --f-d:"Forum","Cormorant Garamond",Georgia,serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#081013; --tint:rgba(9,17,20,.88); --surface:rgba(255,255,255,.075); --surface-2:rgba(255,255,255,.06); --field:rgba(255,255,255,.08);
  --line:rgba(255,255,255,.09); --line-2:rgba(255,255,255,.18); --glass-brd:rgba(255,255,255,.16); --spec:rgba(255,255,255,.22);
  --sheen:linear-gradient(140deg,rgba(255,255,255,.14) 0%,rgba(255,255,255,.03) 34%,rgba(255,255,255,0) 60%);
  --iris:conic-gradient(from 210deg,#7ff0d8,#9fb3ff,#f2a3d6,#8fdcff,#ffe08f,#7ff0d8);
  --pearl:linear-gradient(118deg,#123f40 0%,#1e2d5a 32%,#3d2341 60%,#133a4d 84%,#123f40 100%);
  --ink-grad:linear-gradient(118deg,#c9f7ee 0%,#d6defe 45%,#f6dcef 80%,#d8f3ff 100%);
  --num-grad:linear-gradient(100deg,#8ff0dc 0%,#a9b9ff 55%,#f2b6dd 100%);
  --txt:#f6f0f9; --txt-2:rgba(246,240,249,.72); --txt-3:rgba(246,240,249,.48);
  --accent:#6fd9cf; --accent-2:#a6ece4; --accent-soft:rgba(111,217,207,.15); --accent-ink:#c3f6ef; --on-accent:#05211f;
  --gold:#e2bf72; --gold-soft:rgba(226,191,114,.16);
  --good:#62d39c; --good-soft:rgba(98,211,156,.15); --warn:#ebc062; --warn-soft:rgba(235,192,98,.16); --crit:#f38ea2; --crit-soft:rgba(243,142,162,.16);
  --hero-txt:#fff6fb;
  --aura-1:#167a6c; --aura-2:#3546a8; --aura-3:#7a2f6a; --aura-4:#1a6a8a; --aura-5:#6a5a26; --aura-o:.72;
  --shadow:0 1px 1px rgba(0,0,0,.3),0 16px 36px -16px rgba(0,0,0,.7);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#081013; --tint:rgba(9,17,20,.88); --surface:rgba(255,255,255,.075); --surface-2:rgba(255,255,255,.06); --field:rgba(255,255,255,.08);
  --line:rgba(255,255,255,.09); --line-2:rgba(255,255,255,.18); --glass-brd:rgba(255,255,255,.16); --spec:rgba(255,255,255,.22);
  --sheen:linear-gradient(140deg,rgba(255,255,255,.14) 0%,rgba(255,255,255,.03) 34%,rgba(255,255,255,0) 60%);
  --iris:conic-gradient(from 210deg,#7ff0d8,#9fb3ff,#f2a3d6,#8fdcff,#ffe08f,#7ff0d8);
  --pearl:linear-gradient(118deg,#123f40 0%,#1e2d5a 32%,#3d2341 60%,#133a4d 84%,#123f40 100%);
  --ink-grad:linear-gradient(118deg,#c9f7ee 0%,#d6defe 45%,#f6dcef 80%,#d8f3ff 100%);
  --num-grad:linear-gradient(100deg,#8ff0dc 0%,#a9b9ff 55%,#f2b6dd 100%);
  --txt:#f6f0f9; --txt-2:rgba(246,240,249,.72); --txt-3:rgba(246,240,249,.48);
  --accent:#6fd9cf; --accent-2:#a6ece4; --accent-soft:rgba(111,217,207,.15); --accent-ink:#c3f6ef; --on-accent:#05211f;
  --gold:#e2bf72; --gold-soft:rgba(226,191,114,.16);
  --good:#62d39c; --good-soft:rgba(98,211,156,.15); --warn:#ebc062; --warn-soft:rgba(235,192,98,.16); --crit:#f38ea2; --crit-soft:rgba(243,142,162,.16);
  --hero-txt:#fff6fb;
  --aura-1:#167a6c; --aura-2:#3546a8; --aura-3:#7a2f6a; --aura-4:#1a6a8a; --aura-5:#6a5a26; --aura-o:.72;
  --shadow:0 1px 1px rgba(0,0,0,.3),0 16px 36px -16px rgba(0,0,0,.7);
  color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--txt);font-family:var(--f);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
.num{font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit}
.wrap{max-width:760px;margin:0 auto;padding-top:10px;padding-bottom:calc(92px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* шапка */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:6px 12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.mark{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(140deg,var(--hero-b),var(--hero-a));flex:none}
.mark svg{width:22px;height:22px;stroke:var(--hero-txt);fill:none;stroke-width:1.8}
.brand b{display:block;font-size:15px;font-weight:700;line-height:1.15}
.brand small{display:block;font-size:12px;color:var(--txt-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{appearance:none;border:1px solid var(--line);background:var(--surface);width:40px;height:40px;border-radius:13px;display:grid;place-items:center;cursor:pointer;color:var(--txt);flex:none}
.iconbtn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.iconbtn:focus-visible,.btn:focus-visible,.chip:focus-visible,.tab:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* общие блоки */
.stack{display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;min-width:0}
.h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:0 0 10px}
.h h2{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--txt-3);margin:0}
.h a,.h button.link{font-size:13px;color:var(--accent);text-decoration:none;background:none;border:0;cursor:pointer;padding:0}
.muted{color:var(--txt-3)}
.small{font-size:13px}
.empty{font-size:14px;color:var(--txt-2);padding:6px 0}
.btn{appearance:none;cursor:pointer;border:1px solid var(--line);background:var(--surface-2);color:var(--txt);font-size:14px;font-weight:600;padding:10px 14px;border-radius:13px;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
.btn:hover{border-color:var(--line-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.sm{font-size:13px;padding:7px 11px;border-radius:11px}
.btn.ghost{background:transparent}
.btn.danger{color:var(--crit);border-color:var(--crit);background:var(--crit-soft)}
.btn.block{width:100%}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--txt-2);white-space:nowrap}
.p-good{background:var(--good-soft);color:var(--good)} .p-warn{background:var(--warn-soft);color:var(--warn)} .p-crit{background:var(--crit-soft);color:var(--crit)} .p-acc{background:var(--accent-soft);color:var(--accent-ink)} .p-gold{background:var(--gold-soft);color:var(--gold)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:90;background:var(--txt);color:var(--bg);font-size:14px;padding:10px 16px;border-radius:14px;max-width:min(92vw,520px);box-shadow:var(--shadow);text-align:center}

/* герой */
.hero{position:relative;overflow:hidden;border-radius:24px;padding:20px 18px 18px;color:var(--hero-txt);background:radial-gradient(120% 140% at 100% 0%,var(--hero-b),var(--hero-a) 70%)}
.hero svg.rings{position:absolute;right:-18px;top:-10px;width:170px;height:170px;opacity:.22;stroke:var(--hero-txt);fill:none;stroke-width:1.2}
.hero .names{font-family:var(--f-d);font-size:28px;line-height:1.1;letter-spacing:.01em;position:relative;text-wrap:balance}
.hero .when{font-size:14px;opacity:.85;margin-top:4px;position:relative}
.count{display:flex;align-items:flex-end;gap:10px;margin-top:16px;position:relative}
.count .big{font-family:var(--f-d);font-size:64px;line-height:.85;font-variant-numeric:tabular-nums}
.count .lbl{font-size:14px;opacity:.85;padding-bottom:4px;line-height:1.25}
.hero .btn{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.28);color:var(--hero-txt)}

/* деньги */
.money{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.mk{background:var(--surface-2);border-radius:14px;padding:10px 12px;min-width:0}
.mk .k{font-size:12px;color:var(--txt-3)}
.mk .v{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mk.hl .v{color:var(--accent)}
.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;display:flex;margin-top:12px}
.bar i{display:block;height:100%}
.bar .paid{background:var(--good)} .bar .left{background:var(--accent-2);opacity:.55}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--txt-3);margin-top:8px}
.legend i{display:inline-block;width:8px;height:8px;border-radius:3px;margin-right:5px}

/* списки */
.list{display:flex;flex-direction:column}
.li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:11px 0;border-top:1px solid var(--line);cursor:pointer}
.li:first-child{border-top:0}
.li .t{font-size:15px;font-weight:600;line-height:1.25;overflow:hidden;text-overflow:ellipsis}
.li .s{font-size:13px;color:var(--txt-3);line-height:1.3}
.li .r{text-align:right;font-variant-numeric:tabular-nums;font-size:15px;font-weight:600;white-space:nowrap}
.li .r small{display:block;font-size:12px;font-weight:500;color:var(--txt-3)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--line-2);flex:none}
.dot.ok{background:var(--good)} .dot.warn{background:var(--warn)} .dot.crit{background:var(--crit)} .dot.acc{background:var(--accent)}
.check{appearance:none;width:26px;height:26px;border-radius:9px;border:2px solid var(--line-2);background:var(--surface);display:grid;place-items:center;cursor:pointer;flex:none;padding:0}
.check svg{width:16px;height:16px;stroke:var(--on-accent);fill:none;stroke-width:3;opacity:0}
.check.on{background:var(--good);border-color:var(--good)} .check.on svg{opacity:1;stroke:#fff}
.mono{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:13px;font-weight:700;background:var(--accent-soft);color:var(--accent-ink);flex:none;letter-spacing:.02em}
.mono.ok{background:var(--good-soft);color:var(--good)} .mono.gold{background:var(--gold-soft);color:var(--gold)}

/* команда */
.team{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.tm{display:flex;gap:10px;align-items:center;background:var(--surface-2);border:1px solid transparent;border-radius:14px;padding:10px;cursor:pointer;min-width:0;text-align:left}
.tm:hover{border-color:var(--line-2)}
.tm b{display:block;font-size:14px;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tm small{display:block;font-size:12px;color:var(--txt-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* сегменты и чипы */
.seg{display:flex;gap:4px;background:var(--surface-2);border:1px solid var(--line);border-radius:13px;padding:3px;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{appearance:none;border:0;background:transparent;font-size:13px;font-weight:600;padding:7px 12px;border-radius:10px;color:var(--txt-2);cursor:pointer;white-space:nowrap;flex:none}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--accent-ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{appearance:none;cursor:pointer;border:1px dashed var(--line-2);background:transparent;font-size:13px;padding:6px 11px;border-radius:999px;color:var(--txt-2)}
.chip:hover{border-color:var(--accent);color:var(--accent)}

/* категория */
.cat{padding:0;overflow:hidden}
.cat-h{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.cat-h .t{font-weight:700;font-size:16px}
.cat-h .grow{flex:1;min-width:0}
.cat-body{padding:4px 16px 12px}
.vrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;padding:12px 0;border-top:1px solid var(--line);cursor:pointer}
.vrow:first-child{border-top:0}
.vrow .t{font-weight:600}
.vrow .s{font-size:13px;color:var(--txt-3)}
.vrow .r{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.vrow .r small{display:block;font-size:12px;color:var(--txt-3);font-weight:500}
.mini{height:5px;border-radius:9px;background:var(--surface-2);overflow:hidden;grid-column:1 / -1}
.mini i{display:block;height:100%;background:var(--good)}

/* лист (карточка подрядчика, настройки) */
.sheet{position:fixed;inset:0;z-index:70;background:var(--bg);overflow:auto;-webkit-overflow-scrolling:touch}
.sheet-in{max-width:760px;margin:0 auto;padding-top:calc(env(safe-area-inset-top,0px) + 10px);padding-bottom:calc(40px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet-top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:4px 12px;position:sticky;top:0;background:var(--bg);z-index:2}
.sheet-top .ttl{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--txt-3)}
input.title{width:100%;border:0;background:transparent;font-family:var(--f-d);font-size:30px;line-height:1.15;color:var(--txt);padding:2px 0;outline:none}
input.title::placeholder{color:var(--txt-3)}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld label{font-size:12px;font-weight:600;color:var(--txt-3)}
.fld input,.fld select,.fld textarea{width:100%;min-height:44px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--field);color:var(--txt);padding:10px 12px;font:inherit;font-size:16px;outline:none}
.fld textarea{min-height:84px;resize:vertical}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.withbtn{display:flex;gap:6px}
.withbtn input{flex:1;min-width:0}
.withbtn .iconbtn{height:44px;width:44px}
.pay{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px 10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.pay:first-child{border-top:0}
.pay .pin{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) minmax(0,1.1fr);gap:6px}
.pay input{min-width:0;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--field);color:var(--txt);padding:0 10px;font:inherit;font-size:15px;outline:none}
.pay input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.pay .acts{display:flex;gap:4px}
.pay .acts .iconbtn{width:36px;height:36px;border-radius:10px}
.pay .meta{grid-column:2 / 4;font-size:12px;color:var(--txt-3);margin-top:-2px}
.agree{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:6px 0}
.agree input[type=text]{min-width:0;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--field);color:var(--txt);padding:0 10px;font:inherit;font-size:15px;outline:none}
.agree input[type=text]:focus{border-color:var(--accent)}
.agree .gold.on{background:var(--gold);border-color:var(--gold)}
.statuses{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.statuses::-webkit-scrollbar{display:none}
.st{appearance:none;cursor:pointer;flex:none;font-size:13px;font-weight:600;padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--txt-2)}
.st[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.st.no[aria-pressed="true"]{background:var(--txt-3);border-color:var(--txt-3)}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0}
.sw{appearance:none;width:48px;height:28px;border-radius:99px;background:var(--line-2);position:relative;cursor:pointer;border:0;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .18s}
.sw.on{background:var(--good)} .sw.on::after{left:23px}
.task{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.task:first-child{border-top:0}
.task .t{font-size:15px;line-height:1.3}
.task.done .t{color:var(--txt-3);text-decoration:line-through}
.task .d{font-size:12px;color:var(--txt-3);white-space:nowrap}
.task .x{appearance:none;border:0;background:none;color:var(--txt-3);cursor:pointer;font-size:18px;padding:0 4px}

/* вкладки */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tab{appearance:none;border:0;background:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 8px;font-size:11px;font-weight:600;color:var(--txt-3)}
.tab svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-selected="true"]{color:var(--accent)}

  if(lo==null&&hi==null&&it.code&&CAT[it.code]){const c=CAT[it.code];const age=ageOf(p);
    if((age==null||age>=18)&&sameUnit(it.unit,c.unit)){const r=(p&&p.sex==='f'?c.f:c.m)||c.m;if(r){lo=r[0];hi=r[1];src='typ';}}}
  return {lo,hi,src};}
function statusOf(it,p){const v=num(it.value);if(v==null)return '';const n=normFor(it,p);if(n.lo!=null&&v<n.lo)return 'low';if(n.hi!=null&&v>n.hi)return 'high';if(n.lo==null&&n.hi==null)return '';return 'ok';}

function normalize(j){const o={cfg:Object.assign({},j.cfg||{}),profiles:{},tests:{},docs:{},foods:{},days:{}};

function remap(t){(t.items||[]).forEach(it=>{if(!it.code&&!it.grp){const c=matchCode(it.name,it.unit);if(c){it.code=c;it.name=CAT[c].name;}}});}

/* импорт истории из файла metrika-import */
async function importFile(file){let j;try{j=JSON.parse(await file.text());}catch(e){toast('Не получилось прочитать файл.');return;}
  if(!j||j.format!=='metrika-import'||!Array.isArray(j.tests||[])){toast('Это не файл импорта «Метрики».');return;}j.tests=j.tests||[];
  let p=curP();if(!p){p={id:uid(),name:(j.profile&&j.profile.name)||'Я',sex:'',birth:'',color:COLORS[0],remind:{},created:Date.now()};st.profiles[p.id]=p;setCur(p.id);}
  if(j.profile){let ch=false;if(!p.sex&&j.profile.sex){p.sex=j.profile.sex;ch=true;}if(!p.birth&&j.profile.birth){p.birth=String(j.profile.birth).slice(0,4);ch=true;}if(!p.dob&&/^\d{4}-\d{2}-\d{2}$/.test(j.profile.birth||'')){p.dob=j.profile.birth;ch=true;}if(ch)persist('p',p.id);}
  let added=0,skipped=0,rows=0;
  j.tests.slice().sort((a,b)=>String(a.date).localeCompare(String(b.date))).forEach(t=>{if(!t||!/^\d{4}-\d{2}-\d{2}$/.test(t.date||'')||!Array.isArray(t.items)||!t.items.length){skipped++;return;}
    const items=t.items.map(x=>({id:uid(),code:x.code||null,grp:x.code?undefined:(x.grp||undefined),name:String(x.name||''),value:x.value,unit:x.unit||'',lo:x.lo==null?'':x.lo,hi:x.hi==null?'':x.hi,ref:x.ref||''})).filter(x=>x.name&&x.value!==''&&x.value!=null);
    if(!items.length||findSimilar(p.id,t.date,items)){skipped++;return;}
    const id=uid();st.tests[id]={id,pid:p.id,date:t.date,lab:String(t.lab||''),note:t.source?'Импорт: '+t.source:'',file:null,items,created:Date.now(),by:SY.me?SY.me.name:'',source:t.source||''};persist('a',id);added++;rows+=items.length;});
  let dAdded=0,dSkip=0,linked=0;
  if(Array.isArray(j.docs)&&j.docs.length){let map={};const nn=x=>String(x||'').normalize('NFC').toLowerCase().trim();
    if(SY.ready&&j.docs.some(d=>d.source)){toast('Связываю документы с файлами на Диске…');try{const r=await api('med_list');(r.files||[]).forEach(f=>{map[nn(f.name)]=f;});}catch(e){}}
    j.docs.forEach(x=>{if(!x||!/^\d{4}-\d{2}-\d{2}$/.test(x.date||'')){dSkip++;return;}const title=String(x.title||DK[x.kind]||'Документ');
      if(Object.values(st.docs).some(d=>d.pid===p.id&&d.date===x.date&&d.title===title)){dSkip++;return;}
      const files=[].concat(x.source||[]).map(n=>map[nn(n)]).filter(Boolean).map(f=>({id:f.id,name:f.name,mime:f.mime,med:true}));linked+=files.length;
      const id=uid();st.docs[id]={id,pid:p.id,date:x.date,kind:DK[x.kind]?x.kind:'other',title,spec:x.spec||'',doctor:x.doctor||'',clinic:x.clinic||'',conclusion:x.conclusion||'',recs:x.recs||'',text:x.text||'',note:x.note||'',files,source:[].concat(x.source||[]).join(', '),created:Date.now()};persist('d',id);dAdded++;});}
  render();haptic('ok');choiceBox({title:'Импорт завершён',text:'Добавлено анализов: <b>'+added+'</b> ('+rows+' '+plural(rows,'значение','значения','значений')+').'+(skipped?'<br>Пропущено как повторы: '+skipped+'.':'')+(j.docs?'<br>Обследований: <b>'+dAdded+'</b>'+(linked?', с файлами с Диска: '+linked:'')+(dSkip?', повторов: '+dSkip:'')+'.':''),buttons:[{label:'Отлично',cls:'primary',fn:()=>{closeSheet();tab='ind';render();}}]});}

function choiceBox(o){const el=document.createElement('div');el.className='modal';
  el.innerHTML='<div class="modal-in" role="dialog" aria-modal="true"><h3>'+esc(o.title)+'</h3><p>'+o.text+'</p><div class="stack" style="gap:8px;margin-top:14px">'+o.buttons.map((b,i)=>'<button type="button" class="btn block '+(b.cls||'')+'" data-ch="'+i+'">'+esc(b.label)+'</button>').join('')+'</div></div>';
  document.body.appendChild(el);haptic();
  el.addEventListener('click',e=>{e.stopPropagation();const b=e.target.closest('[data-ch]');if(e.target===el){el.remove();return;}if(!b)return;el.remove();const fn=o.buttons[+b.dataset.ch].fn;if(fn)fn();});}
async function fileHash(file){try{const buf=await file.arrayBuffer();if(window.crypto&&crypto.subtle){const h=await crypto.subtle.digest('SHA-256',buf);return [...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,'0')).join('');}
  const a=new Uint8Array(buf);let h1=2166136261>>>0,h2=0;for(let i=0;i<a.length;i++){h1=Math.imul(h1^a[i],16777619)>>>0;h2=(h2*31+a[i])>>>0;}return 'f'+h1.toString(16)+h2.toString(16)+a.length;}catch(e){return '';}}
/* похожий анализ: тот же профиль и дата, совпадает больше половины значений */
function findSimilar(pid,date,items,skipId){let best=null;
  Object.values(st.tests).forEach(t=>{if(t.pid!==pid||t.id===skipId||t.date!==date)return;const ex={};(t.items||[]).forEach(it=>{ex[itemKey(it)]=String(it.value);});
    const m=items.filter(it=>ex[itemKey(it)]!=null&&ex[itemKey(it)]===String(it.value)).length;
    if(m>=Math.max(3,Math.ceil(items.length*0.5))||(m>=1&&items.length<=2&&m===items.length)){if(!best||m>best.m)best={t,m};}});
  return best;}

/* разбор текста OCR: ищем строки с названием показателя из каталога, рядом — значение, единицы и интервал */
function parseOCRold(text){

  const items=[],seen={};
  const findUnit=s=>{for(const [u,re] of UNITS)if(re.test(s))return u;return '';};
  const stripUnits=s=>s.replace(/(?:[x×х*]\s*)?10\s*(?:\^|\*)?\s*(?:12|9|¹²|⁹)\s*\/\s*л/gi,' ').replace(/[a-zа-яё]+\s*\/\s*[a-zа-яё]+/gi,' ');
  for(let i=0;i<lines.length;i++){
    const low=' '+lines[i].toLowerCase().replace(/ё/g,'е')+' ';let best=null;
    for(const [a,code] of AL){const re=new RegExp('(^|[^a-zа-я0-9])('+a.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')([^a-zа-я0-9]|$)','i');const m=re.exec(low);if(m){best={code,end:m.index+m[1].length+m[2].length};break;}}
    if(!best||seen[best.code])continue;
    const clean=x=>x.replace(/\([^)]*[a-zа-яё][^)]*\)/gi,' ').replace(/\b25\s*[-(]?\s*(?:oh|он)\s*\)?\s*d?\b/gi,' ');
    let seg=clean(lines[i].slice(Math.max(0,best.end-1)));let k=i;
    const hasAlias=x=>{const l=' '+x.toLowerCase().replace(/ё/g,'е')+' ';return AL.some(([a])=>new RegExp('(^|[^a-zа-я0-9])'+a.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'([^a-zа-я0-9]|$)').test(l));};
    if(!/\d/.test(stripUnits(seg))){while(k<i+4&&k+1<lines.length){if(hasAlias(lines[k+1]))break;k++;seg+=' '+clean(lines[k]);}}

    if(m){lo=num(m[1]);hi=num(m[2]);ref=m[0];s2=s2.replace(m[0],' ');}
    else if((m=s2.match(/(?:[<≤]|до)\s*(\d+(?:[.,]\d+)?)/i))){hi=num(m[1]);ref=m[0];s2=s2.replace(m[0],' ');}
    else if((m=s2.match(/(?:[>≥]|от)\s*(\d+(?:[.,]\d+)?)/i))){lo=num(m[1]);ref=m[0];s2=s2.replace(m[0],' ');}
    const vm=s2.match(/(?:^|[^\d.,])([<>]?\s*\d+(?:[.,]\d+)?)/);
    if(!vm)continue;

  }

  if(dm){const d=dm[3]+'-'+dm[2]+'-'+dm[1];if(!isNaN(parseD(d)))date=d;}
  const labs=['Синэво','Synevo','Инвитро','Invitro','Хеликс','Helix','ЛОДЭ','Lode','Синлаб','Synlab','Гемотест','CMD','Кдл','KDL','Медэкспресс','Нордин','Мой доктор'];

/* потоковый разбор XML «Здоровья»: ищем записи веса и роста */
function healthScanner(){const W={},H={};let carry='';
  const take=txt=>{const s=carry+txt;const re=/<Record type="HKQuantityTypeIdentifier(BodyMass|Height)"[^>]*>/g;let m,last=0;
    while((m=re.exec(s))){last=re.lastIndex;const tag=m[0];const v=+((tag.match(/ value="([\d.]+)"/)||[])[1]);const u=(tag.match(/ unit="([^"]+)"/)||[])[1]||'';const d=((tag.match(/ startDate="(\d{4}-\d{2}-\d{2})/)||[])[1]);if(!d||!v)continue;
      if(m[1]==='BodyMass'){const kg=u==='lb'?v*0.453592:u==='g'?v/1000:v;if(kg>25&&kg<300)(W[d]=W[d]||[]).push(kg);}else{const cm=u==='m'?v*100:u==='in'?v*2.54:u==='ft'?v*30.48:v;if(cm>100&&cm<230)H[d]=cm;}}

async function readHealth(file,prog){const sc=healthScanner();const dec=new TextDecoder();const CH=4*1024*1024;const isZip=/\.zip$/i.test(file.name)||/zip/.test(file.type);

      f.ondata=(err,chunk,final)=>{if(err){rej(err);return;}sc.take(d2.decode(chunk,{stream:!final}));};f.start();};
    try{for(let o=0;o<file.size;o+=CH){const buf=new Uint8Array(await file.slice(o,o+CH).arrayBuffer());uz.push(buf,o+CH>=file.size);prog(Math.min(99,Math.round(o/file.size*100)));await new Promise(r=>setTimeout(r,0));}res();}catch(e){rej(e);}});

function devOf(it,p){const v=num(it.value);if(v==null)return 0;const n=normFor(it,p);if(n.hi!=null&&v>n.hi)return (v-n.hi)/Math.max(Math.abs(n.hi),1e-9);if(n.lo!=null&&v<n.lo)return (n.lo-v)/Math.max(Math.abs(n.lo),1e-9);return 0;}
function systemsOf(p){const inds=indicatorsOf(p.id);const byKey={};inds.forEach(x=>byKey[x.key]=x);const vit=vitalsOf(p);const now=today();const docs=docsOf(p.id);
  return SYSTEMS.map(S=>{let xs=[];
    if(S.vital){const v=vit.find(x=>x.key===S.vital);if(v)xs=[v];}
    else{xs=(S.codes||[]).map(c=>byKey[c]).filter(Boolean);if(S.urine)xs=xs.concat(inds.filter(x=>x.grp==='urine'));}
    const lastDate=xs.reduce((m,x)=>x.last.date&&x.last.date>m?x.last.date:m,'');
    const fresh=xs.filter(x=>x.last.date&&(now-parseD(x.last.date))/864e5<=548);
    const outs=fresh.map(x=>({x,d:devOf(x.last,p),s:statusOf(x.last,p)})).filter(o=>o.s==='high'||o.s==='low');
    const maxDev=outs.reduce((m,o)=>Math.max(m,o.d),0);
    let st='none';if(fresh.length){st=!outs.length?'ok':(maxDev>0.25||outs.length>=3)?'bad':'warn';}
    const rd=S.docs?docs.filter(d=>S.docs.test((d.title||'')+' '+(d.spec||''))):[];
    return {S,xs,fresh,outs,st,lastDate,docs:rd};});}

function checkupOf(p){const age=ageOf(p);const inds=indicatorsOf(p.id);const by={};inds.forEach(x=>by[x.key]=x);const docs=docsOf(p.id);const t0=today();const out=[];

    const due=last?addMonths(last,m):'';const remK='ck:'+c.id;const rem=(p.remind||{})[remK]||'';

  const rank={over:0,never:1,soon:2,ok:3};return out.sort((a,b)=>rank[a.st]-rank[b.st]||a.dd-b.dd);}

const extOf=n=>{const m=String(n||'').match(/\.[a-z0-9]{2,5}$/i);return m?m[0].toLowerCase():'';};
const dotDate=d=>d?d.replace(/-/g,'.'):'без даты';
const cleanFN=t=>String(t||'').replace(/[\\/:*?"<>|]+/g,' ').replace(/[«»]/g,'').replace(/\s+/g,' ').trim();
const GRP_SHORT={blood:'ОАК',urine:'ОАМ',bio:'Биохимия',lip:'Липидограмма',carb:'Сахар',horm:'Гормоны',iron:'Витамины',elec:'Электролиты',infl:'Иммунитет',other:'Анализ'};
function testTitle(t){const g=[];(t.items||[]).forEach(it=>{const k=it.code&&CAT[it.code]?CAT[it.code].grp:(it.grp||'other');if(!g.includes(k))g.push(k);});
  const order=['blood','urine','bio','lip','carb','horm','iron','elec','infl','other'];const gs=order.filter(k=>g.includes(k)).map(k=>GRP_SHORT[k]);
  return (gs.length>4?gs.slice(0,4):gs).join('+')||'Анализ';}
const shortClinic=c=>{c=String(c||'').replace(/\([^)]*\)/g,' ').replace(/\s+/g,' ').trim();const pk=c.match(/поликлиник[а-я]*.*?№\s*(\d+)/i);if(pk)return 'Поликлиника №'+pk[1];const q=c.match(/«([^»]+)»/);if(q)c=q[1];c=c.replace(/^(ООО|ОДО|ИООО|ИУП|УЗ|МЦ|МО|медицинский центр)\s+/i,'').replace(/[«»"]/g,'').split(/[,]/)[0].trim();if(c.length>28)c=c.slice(0,28).replace(/\s+\S*$/,'');return c;};
function testFileName(t,f){return cleanFN(dotDate(t.date)+'_'+testTitle(t)+(t.lab?' ('+shortClinic(t.lab)+')':''))+extOf(f&&f.name);}
function docFileName(d,f,i,n){return cleanFN(dotDate(d.date)+'_'+(d.title||DK[d.kind]||'Документ')+(d.clinic?' ('+shortClinic(d.clinic)+')':'')+(n>1?' '+(i+1):''))+extOf(f&&f.name);}
async function autoName(kind,id){if(!SY.ready)return;try{
  if(kind==='a'){const t=st.tests[id];const f=t&&t.file;if(!f||!f.med)return;const nm=testFileName(t,f);if(f.name===nm)return;const r=await api('file_rename',{fid:f.id,name:nm});f.name=r.name||nm;persist('a',id);}
  else{const d=st.docs[id];if(!d)return;const fs=(d.files||[]).filter(f=>f.med);let ch=false;for(let i=0;i<fs.length;i++){const nm=docFileName(d,fs[i],i,fs.length);if(fs[i].name===nm)continue;const r=await api('file_rename',{fid:fs[i].id,name:nm});fs[i].name=r.name||nm;ch=true;}if(ch)persist('d',id);}
}catch(e){}}
const nfc=x=>String(x||'').normalize('NFC').toLowerCase().trim();
async function medScan(){const r=await api('med_list');const files=r.files||[];const p=curP();
  const byId={},byName={};files.forEach(f=>{byId[f.id]=f;byName[nfc(f.name)]=f;});
  const used={};const plan=[];
  Object.values(st.docs).filter(d=>d.pid===p.id).forEach(d=>{const fs=(d.files||[]).filter(f=>byId[f.id]);fs.forEach((f,i)=>{used[f.id]=1;plan.push({id:f.id,old:byId[f.id].name,name:docFileName(d,byId[f.id],i,fs.length),kind:'d',ref:d.id});});
    String(d.source||'').split(/,\s*/).forEach(n=>{const f=byName[nfc(n)];if(f)used[f.id]=1;});});
  Object.values(st.tests).filter(t=>t.pid===p.id).forEach(t=>{let f=t.file&&byId[t.file.id];if(!f&&t.source)f=byName[nfc(t.source)];if(!f)return;used[f.id]=1;if(plan.some(x=>x.id===f.id))return;plan.push({id:f.id,old:f.name,name:testFileName(t,f),kind:'a',ref:t.id});});
  const cnt={};plan.forEach(x=>{const k=nfc(x.name);cnt[k]=(cnt[k]||0)+1;});const seen={};plan.forEach(x=>{const k=nfc(x.name);if(cnt[k]>1){seen[k]=(seen[k]||0)+1;if(seen[k]>1)x.name=x.name.replace(/(\.[a-z0-9]{2,5})?$/i,' '+seen[k]+'$1');}});
  const fresh=files.filter(f=>!used[f.id]&&!/^metrika|^~/.test(f.name)).sort((a,b)=>(b.created||0)-(a.created||0));
  return {files,plan:plan.filter(x=>x.old!==x.name),fresh};}

async function medImport(kind,f){const file={id:f.id,name:f.name,mime:f.mime,med:true};
  if(kind==='d'){editDoc(null);draft.d.files=[file];renderDocForm();toast('Распознаю документ…');
    try{const x=await api('doc_read',{fid:f.id});if(!draft||draft.kind!=='doc')return;const d=draft.d;if(x.mode==='ai'&&x.doc){const g=x.doc;['title','spec','doctor','clinic','conclusion','recs','text'].forEach(k=>{if(!d[k]&&g[k])d[k]=String(g[k]);});if(/^\d{4}-\d{2}-\d{2}$/.test(g.date||''))d.date=g.date;if(DK[g.kind])d.kind=g.kind;}else if(x.text)d.text=x.text;renderDocForm();toast('Проверьте поля и сохраните.');}catch(e){toast('Не получилось распознать — заполните вручную.');}
    return;}
  openSheet(top('Распознаю бланк')+'<div class="stack"><section class="card" style="text-align:center"><div class="spin"></div><p class="small" style="margin:8px 0 0;color:var(--txt-2)">Читаю файл с Диска…</p></section></div>','busy');const t0=Date.now();
  try{let res=null;
    if(/pdf/i.test(f.mime)||/\.pdf$/i.test(f.name)){const g=await api('file_get',{fid:f.id});if(g.data){const blob=await (await fetch(g.data)).blob();try{const pages=await pdfPages(blob);const pl=pdfPagesToLines(pages);res={items:rowsToItems(pl.lines),date:findDate(pl.head),lab:findLab(pl.head+' '+pages.flat().map(i=>i.s).join(' ')),mode:'pdf'};}catch(e){}}}

етрика»), задайте описание и аватар (тексты и картинки — Загрузки → metrika-telegram).", "2. Новый токен → свойство BOT_TOKEN в Apps Script.", "3. Bot Settings → Configure Mini App и Menu Button → адрес приложения.", "", "Ваш Telegram-аккаунт тот же, поэтому вы останетесь владельцем.", "", "6. Как устроены данные (для технической помощи)", "", "- Таблица «Метрика — данные», лист data: столбцы key, json, updatedAt, by.", "  - p_<id> — профиль: имя, пол, дата рождения (dob), рост (height), вес (wlog: «ГГММДД:кг;…»), свои нормы (norms), напоминания (remind).", "  - a_<id> — анализ: дата, лаборатория, файл бланка, список показателей (code, name, value, unit, lo, hi).", "  - d_<id> — обследование: дата, вид, название, врач, клиника, заключение, рекомендации, файлы.", "  - f_<ГГГГ-ММ-ДД> — дневник питания за день: приём пищи, продукт, граммы, ккал, белки, жиры, углеводы.", "  - m_<id> — свой продукт или рецепт: КБЖУ на 100 г, порции, штрихкод, ингредиенты, фото.", "  - Листы history и log — прошлые версии и журнал изменений.", "- Файл metrika-fooddb.json в папке «Метрика» — база продуктов и брендов из Open Food Facts. Её не нужно восстанавливать: сервер сам пересобирает её раз в две недели.", "- Резервная копия — JSON со всеми ключами и телами; восстанавливается из приложения.", "- Файл импорта (metrika-import) — JSON с массивами tests и docs; загружается через ⚙️ → «Импорт истории».", "", "7. Что регулярно делать", "", "- Раз в несколько месяцев открывайте читаемую таблицу и проверяйте, что она обновляется (лист «Технические данные», строка «Обновлено»).", "- После крупных изменений приложения новые версии index.html и сервера сохраняются в Загрузки → metrika-telegram.", ""];

function buildReadable(p){const ts=testsOf(p.id).slice();const stTxt={high:'выше нормы',low:'ниже нормы',ok:'в норме'};const stCol={high:'#c03550',low:'#2f6fd0'};
  const A=[['Дата','Лаборатория','Раздел','Показатель','Значение','Ед.','Норма от','Норма до','Статус','Бланк','Источник']],Ac=[null];
  ts.forEach(t=>{(t.items||[]).forEach(it=>{const g=it.code&&CAT[it.code]?CAT[it.code].grp:(it.grp||'other');const n=normFor(it,p);const s=statusOf(it,p);
    A.push([t.date||'',t.lab||'',grpName(g),it.code&&CAT[it.code]?CAT[it.code].name:it.name,it.value,it.unit||'',n.lo==null?'':n.lo,n.hi==null?'':n.hi,stTxt[s]||'',driveLink(t.file,'бланк'),t.source||t.note||'']);Ac.push(stCol[s]||null);});});
  const inds=indicatorsOf(p.id);const dates=[...new Set(ts.map(t=>t.date).filter(Boolean))].sort();
  const D=[['Раздел','Показатель','Ед.'].concat(dates)];
  GROUPS.forEach(([g,gn])=>{inds.filter(x=>x.grp===g).sort((a,b)=>a.name.localeCompare(b.name,'ru')).forEach(x=>{const row=[gn,x.name,x.last.unit||''];const m={};x.pts.forEach(q=>{m[q.date]=q.value;});dates.forEach(d=>row.push(m[d]!=null?m[d]:''));D.push(row);});});
  const O=[['Дата','Вид','Название','Специальность','Врач','Клиника','Заключение','Рекомендации','Заметка','Файл 1','Файл 2','Файл 3']];
  docsOf(p.id).forEach(d=>{const fs=d.files||[];O.push([d.date||'',DK[d.kind]||'',d.title||'',d.spec||'',d.doctor||'',d.clinic||'',d.conclusion||'',d.recs||'',d.note||'',driveLink(fs[0],fs[0]&&fs[0].name),driveLink(fs[1],fs[1]&&fs[1].name),driveLink(fs[2],fs[2]&&fs[2].name)]);});
  const h=num(p.height);const W=[['Дата','Вес, кг','ИМТ']];wlogGet(p).slice().reverse().forEach(w=>W.push([w.date,w.kg,h?+(w.kg/Math.pow(h/100,2)).toFixed(1):'']));
  const P=[['Поле','Значение'],['Имя',p.name||''],['Пол',p.sex==='m'?'мужской':p.sex==='f'?'женский':''],['Дата рождения',p.dob||p.birth||''],['Рост, см',p.height||'']];
  Object.entries(p.norms||{}).forEach(([k,v])=>P.push(['Своя норма: '+(CAT[k]?CAT[k].name:k),(v.lo!==''?'от '+v.lo:'')+(v.hi!==''?' до '+v.hi:'')]));
  Object.entries(p.remind||{}).forEach(([k,v])=>{const ck=/^ck:/.test(k)?CHECK.find(c=>'ck:'+c.id===k):null;P.push(['Напоминание: '+(ck?ck.t:CAT[k]?CAT[k].name:k),v]);});
  const FG=foodGoal(p);const fdays=Object.keys(st.days||{}).sort().reverse();
  const FDy=[['Дата','Ккал','Белки, г','Жиры, г','Углеводы, г','Цель, ккал','Записей']];const FE=[['Дата','Приём пищи','Продукт','Марка','Количество','Граммы','Ккал','Белки','Жиры','Углеводы']];
  fdays.forEach(d=>{const its=dayItems(d);const s=sumItems(its);FDy.push([d,Math.round(s.k),r1(s.p),r1(s.f),r1(s.c),FG.k,its.length]);
    MEALS.forEach(([m,n])=>its.filter(i=>i.meal===m).forEach(i=>FE.push([d,n,i.name,i.br||'',i.u&&i.u!=='г'?i.q+' '+i.u:'',i.g,i.k,i.p,i.f,i.c])));});
  const FM=[['Тип','Название','Марка','Штрихкод','Ккал/100 г','Белки','Жиры','Углеводы','Порции','Ингредиенты']];
  myFoods().sort((a,b)=>a.name.localeCompare(b.name,'ru')).forEach(f=>FM.push([f.kind==='recipe'?'рецепт':'продукт',f.name,f.brand||'',f.code||'',f.per.k,f.per.p,f.per.f,f.per.c,(f.units||[]).map(u=>u.n+' = '+u.g+' г').join('; '),(f.ings||[]).map(i=>i.name+' '+i.g+' г').join('; ')]));
  const C=[['Что пройти','Последний раз','Следующий срок','Состояние','Почему']];const ckT={over:'просрочено',never:'ещё не делали',soon:'скоро',ok:'в порядке'};
  checkupOf(p).forEach(r=>C.push([r.t,r.last||'',r.due||'',ckT[r.st],r.why]));

let expT=0,expBusy=false;
function scheduleExport(){if(!(TGA&&SY.ready&&!SY.ro))return;clearTimeout(expT);expT=setTimeout(()=>exportReadable(false),45000);}
async function exportReadable(manual){if(!(SY.ready&&!SY.ro)||expBusy)return;const p=curP();if(!p)return;expBusy=true;
  try{const r=await api('readable_put',{sheets:buildReadable(p)});lsSet('health-readable',JSON.stringify({url:r.url,at:Date.now()}));if(manual){toast('Таблица обновлена.');refreshReadableUI();}}
  catch(e){if(manual)toast(e.code==='bad_op'?'Обновите сервер до v5.':'Не получилось обновить таблицу.');}finally{expBusy=false;}}
function readableInfo(){try{return JSON.parse(lsGet('health-readable')||'null');}catch(e){return null;}}
function readableCard(){if(!(SY.ready&&!SY.ro))return '';const r=readableInfo();
  return '<section class="card" id="readCard"><div class="h"><h2>Таблица и восстановление</h2></div><p class="small" style="margin:0 0 10px;color:var(--txt-2)">Все анализы, обследования, вес и профиль копируются в обычную Google-таблицу на Диске со ссылками на файлы. Там же — лист «Как восстановить». Обновляется сама после изменений.</p>'+
   '<div class="small muted" style="margin-bottom:8px">'+(r&&r.at?'Обновлено '+fmtAgo(r.at):'Ещё не создавалась')+'</div><div class="row" style="gap:8px">'+(r&&r.url?'<button type="button" class="btn sm primary" data-openurl="'+esc(r.url)+'">Открыть таблицу</button>':'')+'<button type="button" class="btn sm" data-act="exportnow">'+(r&&r.url?'Обновить сейчас':'Создать таблицу')+'</button></div></section>';}
function refreshReadableUI(){const el=$('#readCard');if(el)el.outerHTML=readableCard();}

function buildReport(p){const inds=indicatorsOf(p.id),ts=testsOf(p.id);const e=esc;const now=new Date();
  let h='<html><head><meta charset="utf-8"><style>body{font-family:Arial,Helvetica,sans-serif;font-size:10pt;color:#122026;line-height:1.35}h1{font-family:Georgia,serif;font-weight:normal;font-size:22pt;margin:0;color:#0b5357}h2{font-size:12.5pt;margin:20px 0 6px;padding-bottom:4px;border-bottom:2px solid #bfe3df;color:#0b5357}.m{color:#5a6d72}.s{font-size:8.5pt;color:#5a6d72}table{width:100%;border-collapse:collapse;margin:4px 0 8px}th{text-align:left;font-size:8.5pt;color:#5a6d72;border-bottom:1.5px solid #bcd7d4;padding:4px 5px}td{vertical-align:top;border-bottom:1px solid #e3efee;padding:4px 5px}.lo{color:#2f6fd0;font-weight:bold}.hi{color:#c03550;font-weight:bold}.num{white-space:nowrap}</style></head><body>';
  h+='<h1>'+e(p.name)+'</h1><div class="m">'+[p.sex==='f'?'женщина':p.sex==='m'?'мужчина':'',ageOf(p)!=null?ageOf(p)+' '+plural(ageOf(p),'год','года','лет'):'',p.birth?'год рождения '+e(p.birth):''].filter(Boolean).join(' · ')+'</div><div class="s">Сводка анализов, сформирована '+now.toLocaleDateString('ru-RU')+'. Анализов: '+ts.length+'.</div>';
  GROUPS.forEach(([g,gn])=>{const arr=inds.filter(x=>x.grp===g).sort((a,b)=>a.name.localeCompare(b.name,'ru'));if(!arr.length)return;
    h+='<h2>'+gn+'</h2><table><tr><th>Показатель</th><th>Последнее</th><th>Дата</th><th>Норма</th><th>Предыдущие</th></tr>'+arr.map(x=>{const it=x.last,s=statusOf(it,p),n=normFor(it,p);
      return '<tr><td>'+e(x.name)+'</td><td class="num '+(s==='low'?'lo':s==='high'?'hi':'')+'">'+e(fmtN(num(it.value))||it.value)+' '+e(it.unit||'')+(s==='low'?' ↓':s==='high'?' ↑':'')+'</td><td class="num">'+e(fmtD(it.date))+'</td><td class="num">'+e(refTxt(n))+(n.src==='typ'?'*':'')+'</td><td class="s">'+x.pts.slice(0,-1).slice(-4).reverse().map(q=>e(fmtN(num(q.value))||q.value)+' ('+e(fmtDs(q.date))+')').join(', ')+'</td></tr>';}).join('')+'</table>';});
  h+='<h2>Все анализы</h2>'+ts.map(t=>'<div style="margin:8px 0 2px"><b>'+e(fmtD(t.date))+'</b>'+(t.lab?' · '+e(t.lab):'')+(t.note?' <span class="s">— '+e(t.note)+'</span>':'')+'</div><table>'+(t.items||[]).map(it=>{const s=statusOf(it,p),n=normFor(it,p);return '<tr><td>'+e(it.code&&CAT[it.code]?CAT[it.code].name:it.name)+'</td><td class="num '+(s==='low'?'lo':s==='high'?'hi':'')+'">'+e(fmtN(num(it.value))||it.value)+' '+e(it.unit||'')+'</td><td class="num">'+e(refTxt(n))+(n.src==='typ'?'*':'')+'</td></tr>';}).join('')+'</table>').join('');
  h+='<p class="s">* Типичная норма для взрослых, если на бланке не указан свой интервал. Отчёт не является медицинским заключением.</p></body></html>';return h;}
function exportPDF(btn){const p=curP();const html=buildReport(p);
  if(SY.ready&&SY.owner){if(btn){btn.disabled=true;btn.dataset.lbl=btn.innerHTML;btn.textContent='Готовлю PDF…';}
    api('pdf',{html,name:'Анализы — '+p.name}).then(r=>{openUrl(r.url);toast('PDF готов и сохранён на Google Диске.');}).catch(()=>toast('Не получилось сделать PDF, проверьте интернет.')).finally(()=>{if(btn){btn.disabled=false;btn.innerHTML=btn.dataset.lbl;}});return;}
  if(!TGA){const w=window.open('','_blank');if(w){w.document.write(html.replace('</body>','<script>setTimeout(()=>print(),400)<\/script></body>'));w.document.close();return;}}
  toast('PDF будет доступен после подключения сервера.');}

const FDB={rows:null,n:null,byCode:null,at:0,busy:false,loading:false,err:''};
function idbOpen(){return new Promise((res,rej)=>{try{const r=indexedDB.open('metrika',1);r.onupgradeneeded=()=>{try{r.result.createObjectStore('kv');}catch(e){}};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);}catch(e){rej(e);}});}
async function kvGet(k){try{const db=await idbOpen();return await new Promise(res=>{const t=db.transaction('kv').objectStore('kv').get(k);t.onsuccess=()=>res(t.result);t.onerror=()=>res(null);});}catch(e){return null;}}
async function kvSet(k,v){try{const db=await idbOpen();await new Promise(res=>{const t=db.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=res;t.onerror=res;});}catch(e){}}

async function fdbRefresh(force){if(FDB.busy||!SY.ready)return;const last=+lsGet('metrika-fdb-check')||0;if(!force&&FDB.rows&&Date.now()-last<864e5)return;
  FDB.busy=true;FDB.err='';if(sheetKind==='fadd')refreshAddResults();

  catch(e){FDB.err=e.code==='bad_op'?'old':'fail';}finally{FDB.busy=false;}if(sheetKind==='fadd')refreshAddResults();}
function fdbSrc(i){const r=FDB.rows[i];const units=[];if(r[7])units.push({n:'порция',g:r[7]});if(r[8]&&r[8]!==r[7])units.push({n:'упаковка',g:r[8]});
  const o={name:r[1],brand:r[2],code:/^(00)?9999/.test(r[0])?'':r[0],per:{k:r[3],p:r[4],f:r[5],c:r[6]},units};return {ref:'',name:r[1],brand:r[2],per:o.per,units,kind:'off',off:o,by:/^481/.test(r[0])};}
function fdbSearch(q,words,lim){if(!FDB.rows)return [];const out=[];const n=FDB.n;for(let i=0;i<n.length;i++){const x=n[i];let ok=true;for(const w of words){if(!x.includes(w)){ok=false;break;}}if(ok)out.push(i);}
  const sc=i=>{const x=n[i];return (x.startsWith(q)?0:x.startsWith(words[0])?1:(' '+x).includes(' '+words[0])?2:3)*1000-(/^481/.test(FDB.rows[i][0])?500:0)+x.length;};
  return out.sort((a,b)=>sc(a)-sc(b)).slice(0,lim).map(fdbSrc);}

  h+='<button type="button" class="btn primary block big-cta" data-fsave>'+(A.ing!=null?'Сохранить':FD.pick?'Добавить в рецепт':A.entry?'Сохранить':'Добавить в '+MEAL_N[A.meal].toLowerCase())+'</button>';

function saveAmount(){const A=FD.amount;const g=amtG();if(!(g>0)){toast('Укажите количество.');return;}const q=num(A.q);
  if(A.ing!=null){const r=FD.recipe;const it=r.ings[A.ing];if(it){it.g=g;it.q=q;it.u=A.u;}renderRecipe();return;}
  if(FD.pick){addIng(A.src,g,q,A.u);return;}
  if(A.entry){const d=st.days[A.date];const it=d&&d.items.find(x=>x.id===A.entry.id);if(it){Object.assign(it,{g,q,u:A.u,meal:A.meal},macroOf(A.src.per,g));persist('f',A.date);}closeSheet();haptic('ok');return;}
  FD.meal=A.meal;const it=addEntry(foodDate,A.meal,A.src,g,q,A.u);haptic('ok');render();
  if(FD.ret==='home'||FD.ret==='diary'){FD.ret=null;closeSheet();toast('+ '+A.src.name+' · '+r0(it.k)+' ккал');return;}
  FD.q='';renderFoodAdd();toast('+ '+A.src.name+' · '+r0(it.k)+' ккал','Отменить',()=>{delEntry(foodDate,it.id);render();if(sheetKind==='fadd')renderFoodAdd();});}

function saveFood(){const f=FD.food;f.name=String(f.name||'').trim();if(!f.name){toast('Введите название.');return;}
  ['k','p','f','c'].forEach(k=>{f.per[k]=num(f.per[k])||0;});if(!f.per.k)f.per.k=r1(f.per.p*4+f.per.f*9+f.per.c*4);
  if(!f.per.k&&!f.per.p&&!f.per.f&&!f.per.c){toast('Укажите калорийность.');return;}
  f.units=(f.units||[]).map(u=>({n:String(u.n||'').trim(),g:num(u.g)})).filter(u=>u.n&&u.g>0);f.code=String(f.code||'').replace(/\D/g,'');
  if(JSON.stringify(f).length>45000){delete f.photo;toast('Фото слишком большое — сохранил без него.');}
  st.foods[f.id]=f;persist('m',f.id);haptic('ok');
  if(FD.foodRet==='add'){FD.foodRet=null;openAmount({src:srcOf(f)});return;}closeSheet();toast('Продукт сохранён.');}

/* ---------- рецепт ---------- */
function editRecipe(id){const r=id&&st.foods[id]?JSON.parse(JSON.stringify(st.foods[id])):{id:uid(),kind:'recipe',name:'',ings:[],servings:1,yieldG:'',photo:'',src:'own',created:Date.now()};FD.recipe=r;FD.pick=false;renderRecipe();}
function recTotals(r){const s={k:0,p:0,f:0,c:0,g:0};(r.ings||[]).forEach(i=>{const m=macroOf(i.per,i.g);s.k+=m.k;s.p+=m.p;s.f+=m.f;s.c+=m.c;s.g+=+i.g||0;});const y=num(r.yieldG)||s.g;const sv=Math.max(1,num(r.servings)||1);
  return {s,y,sv,per:y?{k:r1(s.k/y*100),p:r1(s.p/y*100),f:r1(s.f/y*100),c:r1(s.c/y*100)}:{k:0,p:0,f:0,c:0},portion:r1(y/sv)};}
function renderRecipe(){FD.pick=false;FD.amount=null;const r=FD.recipe;const T=recTotals(r);const isNew=!st.foods[r.id];
  openSheet(topF(isNew?'Новый рецепт':'Рецепт','data-close',isNew?'':'<button type="button" class="iconbtn" data-fdelfood aria-label="Удалить рецепт">'+ICON.del+'</button>')+'<div class="stack">'+
   '<section class="card"><div class="row" style="flex-wrap:nowrap;gap:12px;align-items:flex-end"><label class="fph lg pick" style="position:relative">'+(r.photo?'<img src="'+r.photo+'" alt="">':'📷')+'<input type="file" accept="image/*" data-frphoto style="position:absolute;inset:0;opacity:0"></label><div class="fld" style="flex:1"><label>Название блюда</label><input data-fr="name" value="'+esc(r.name)+'" placeholder="Например, Сырники"></div></div></section>'+
   '<section class="card"><div class="h"><h2>Ингредиенты</h2><span class="pill p-acc">'+(r.ings||[]).length+'</span></div>'+((r.ings||[]).length?'<div class="list">'+r.ings.map((i,n)=>{const m=macroOf(i.per,i.g);return '<div class="fent" data-fing="'+n+'"><div style="min-width:0"><div class="t">'+esc(i.name)+'</div><div class="s"><span class="famt">'+(i.u&&i.u!=='г'?fN(i.q)+' '+esc(i.u)+' · ':'')+fN(i.g)+' г</span> · Б '+fN(m.p)+' · Ж '+fN(m.f)+' · У '+fN(m.c)+'</div></div><div class="r">'+r0(m.k)+'</div></div>';}).join('')+'</div>':'<div class="small muted">Добавьте продукты с граммовкой — калорийность посчитается сама.</div>')+
   '<button type="button" class="btn block" data-fingadd style="margin-top:10px">+ Ингредиент</button></section>'+
   '<section class="card"><div class="row" style="gap:10px;flex-wrap:nowrap"><div class="fld"><label>Порций</label><input data-fr="servings" inputmode="numeric" value="'+esc(r.servings||1)+'"></div><div class="fld"><label>Вес готового, г</label><input data-fr="yieldG" inputmode="decimal" value="'+esc(r.yieldG||'')+'" placeholder="'+r0(T.s.g)+'"></div></div><p class="note" style="margin:8px 0 0">Вес готового блюда меняется при варке и жарке. Если не знаете — оставьте пустым, возьму сумму ингредиентов.</p>'+
   '<div id="frtot" style="margin-top:12px">'+recTotHTML(T)+'</div></section>'+
   shareToggle(r)+'<button type="button" class="btn primary block big-cta" data-fsaverec>Сохранить рецепт</button></div>','frecipe');}
function recTotHTML(T){return '<div class="ftot three"><div><b>'+r0(T.s.k)+'</b><span>ккал всего</span></div><div><b>'+r0(T.per.k*T.portion/100)+'</b><span>ккал в порции ('+r0(T.portion)+' г)</span></div><div><b>'+r0(T.per.k)+'</b><span>ккал на 100 г</span></div></div><div class="small muted" style="text-align:center;margin-top:6px">Порция: Б '+fN(r1(T.per.p*T.portion/100))+' · Ж '+fN(r1(T.per.f*T.portion/100))+' · У '+fN(r1(T.per.c*T.portion/100))+' г</div>';}
function addIng(s,g,q,u){const r=FD.recipe;r.ings=r.ings||[];r.ings.push({ref:s.ref||'',name:s.name,per:s.per,g:r1(g),q:r1(q),u:u||'г',units:s.units||[]});FD.pick=false;renderRecipe();toast('+ '+s.name);}
function saveRecipe(){const r=FD.recipe;r.name=String(r.name||'').trim();if(!r.name){toast('Введите название.');return;}if(!(r.ings||[]).length){toast('Добавьте ингредиенты.');return;}
  const T=recTotals(r);r.per=T.per;r.servings=T.sv;r.yieldG=num(r.yieldG)||'';r.units=[{n:'порция',g:T.portion}];if(T.sv>1||num(r.yieldG))r.units.push({n:'всё блюдо',g:r1(T.y)});
  r.ings=r.ings.map(i=>({ref:i.ref,name:i.name,per:i.per,g:i.g,q:i.q,u:i.u,units:(i.units||[]).slice(0,3)}));
  if(JSON.stringify(r).length>45000){delete r.photo;toast('Фото слишком большое — сохранил без него.');}
  st.foods[r.id]=r;persist('m',r.id);haptic('ok');FD.recipe=null;closeSheet();toast('Рецепт сохранён. Он есть во вкладке «Рецепты» при добавлении еды.');}

/* ---------- отчёт за неделю ---------- */
function weekDays(){const mon=addDays(mondayOf(ymd(today())),-7*repWeek);return [0,1,2,3,4,5,6].map(i=>addDays(mon,i));}
function reportHTML(p){const G=foodGoal(p);const days=weekDays();const t=ymd(today());
  const per=days.map(d=>{const its=dayItems(d);const o={d,all:sumItems(its)};MEALS.forEach(([m])=>{o[m]=sumItems(its.filter(i=>i.meal===m));});return o;});
  const filled=per.filter(x=>x.all.k>0);const nF=filled.length||1;
  const lbl=fmtDs(days[0])+' – '+fmtDs(days[6]);
  let h='<div class="fdate"><button type="button" class="iconbtn" data-fweek="1" aria-label="Прошлая неделя">'+ICON.back+'</button><div class="fdl"><b>'+(repWeek===0?'Эта неделя':repWeek===1?'Прошлая неделя':'Неделя')+'</b><span>'+lbl+'</span></div><button type="button" class="iconbtn" data-fweek="-1" '+(repWeek===0?'disabled style="opacity:.3;transform:scaleX(-1)"':'style="transform:scaleX(-1)"')+' aria-label="Следующая неделя">'+ICON.back+'</button></div>';
  h+='<div class="seg" role="group">'+[['k','Калории'],['m','Белки · жиры · углеводы']].map(([k,l])=>'<button type="button" data-frep="'+k+'" aria-pressed="'+(repMode===k)+'">'+l+'</button>').join('')+'</div>';
  if(!filled.length)return h+'<section class="card"><div class="empty">За эту неделю записей нет.</div></section>';
  const W=340,H=190,L=40,B=24,T=10,bw=26;const keys=repMode==='k'?MEALS.map(m=>m[0]):['p','f','c'];
  const val=(o,k)=>repMode==='k'?o[k].k:k==='p'?o.all.p*4:k==='f'?o.all.f*9:o.all.c*4;
  const mx=Math.max(G.k*1.15,...per.map(o=>keys.reduce((s,k)=>s+val(o,k),0)))||1;const sy=v=>T+(H-T-B)*(1-v/mx);
  let svg='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Калории по дням">';
  [0,0.25,0.5,0.75,1].forEach(f=>{const v=Math.round(mx*f/100)*100;svg+='<line x1="'+L+'" x2="'+W+'" y1="'+sy(v)+'" y2="'+sy(v)+'" stroke="var(--line)"/><text x="'+(L-5)+'" y="'+(sy(v)+4)+'" text-anchor="end">'+(v>=10000?Math.round(v/1000)+'k':v)+'</text>';});
  per.forEach((o,i)=>{const cx=L+(W-L)/7*(i+0.5);let acc=0;keys.forEach(k=>{const v=val(o,k);if(v<=0)return;const y1=sy(acc+v),y0=sy(acc);svg+='<rect x="'+(cx-bw/2)+'" y="'+y1+'" width="'+bw+'" height="'+Math.max(0,y0-y1-1)+'" rx="3" fill="'+(repMode==='k'?MEAL_COL[k]:MAC_COL[k])+'"/>';acc+=v;});
    svg+='<text x="'+cx+'" y="'+(H-8)+'" text-anchor="middle"'+(o.d===t?' style="font-weight:700;fill:var(--txt)"':'')+'>'+WD[i]+'</text>';});
  svg+='<line x1="'+L+'" x2="'+W+'" y1="'+sy(G.k)+'" y2="'+sy(G.k)+'" stroke="var(--crit)" stroke-dasharray="5 4" stroke-width="1.5"/><text x="'+W+'" y="'+(sy(G.k)-4)+'" text-anchor="end" style="fill:var(--crit)">цель '+G.k+'</text></svg>';
  h+='<section class="card">'+svg+'<div class="legend">'+(repMode==='k'?MEALS.map(([m,n])=>'<span><i style="background:'+MEAL_COL[m]+'"></i>'+n+'</span>'):[['p','Белки'],['f','Жиры'],['c','Углеводы']].map(([k,n])=>'<span><i style="background:'+MAC_COL[k]+'"></i>'+n+'</span>')).join('')+'</div></section>';
  const tot=sumItems([].concat(...days.map(dayItems)));

/* ---------- штрихкод: камера (BarcodeDetector или ZXing), фото, ручной ввод ---------- */
let ZXP=null;function loadZXing(){if(ZXP)return ZXP;ZXP=new Promise((res,rej)=>{if(window.ZXing){res(window.ZXing);return;}const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js';s.onload=()=>window.ZXing?res(window.ZXing):rej(new Error('zxing'));s.onerror=()=>{ZXP=null;rej(new Error('zxing'));};document.head.appendChild(s);});return ZXP;}
async function nativeDetector(){try{if(!('BarcodeDetector' in window))return null;const f=await BarcodeDetector.getSupportedFormats();const want=['ean_13','ean_8','upc_a','upc_e','code_128'].filter(x=>f.includes(x));return want.length?new BarcodeDetector({formats:want}):null;}catch(e){return null;}}
let SCAN=null;
function closeScan(){if(!SCAN)return;SCAN.done=true;try{SCAN.reader&&SCAN.reader.reset();}catch(e){}try{SCAN.stream&&SCAN.stream.getTracks().forEach(t=>t.stop());}catch(e){}SCAN.el.remove();SCAN=null;}
async function openScan(){closeScan();const el=document.createElement('div');el.className='scan';
  el.innerHTML='<video playsinline muted autoplay></video><div class="sframe"><i></i></div><div class="stop"><button type="button" class="iconbtn" data-sx aria-label="Закрыть">'+ICON.x+'</button><span>Наведите на штрихкод</span><span style="width:40px"></span></div>'+
   '<div class="sbot"><div class="smsg" id="smsg">Включаю камеру…</div><div class="row" style="flex-wrap:nowrap;gap:8px"><input class="inp" id="scode" inputmode="numeric" placeholder="или введите цифры"><button type="button" class="btn primary" data-sgo>Найти</button></div><label class="btn block" style="position:relative;margin-top:8px">📷 Сфотографировать штрихкод<input type="file" accept="image/*" capture="environment" data-sphoto style="position:absolute;inset:0;opacity:0"></label></div>';
  document.body.appendChild(el);SCAN={el,done:false};const S0=SCAN;const msg=t=>{const m=el.querySelector('#smsg');if(m)m.textContent=t;};
  el.addEventListener('click',e=>{if(e.target.closest('[data-sx]')){closeScan();return;}if(e.target.closest('[data-sgo]')){const v=el.querySelector('#scode').value;closeScan();lookupBarcode(v);}});
  el.querySelector('#scode').addEventListener('keydown',e=>{if(e.key==='Enter'){const v=e.target.value;closeScan();lookupBarcode(v);}});
  el.querySelector('[data-sphoto]').addEventListener('change',async e=>{const f=e.target.files&&e.target.files[0];e.target.value='';if(!f)return;S0.paused=true;msg('Читаю фото…');let c=await decodeImage(f);
    if(!c&&SY.ai){msg('Прошу нейросеть прочитать цифры…');c=await decodeByAI(f);if(c&&!eanOk(c)){const i=el.querySelector('#scode');if(i)i.value=c;msg('Проверьте цифры и нажмите «Найти».');S0.paused=false;return;}}
    if(c){closeScan();lookupBarcode(c);}else{S0.paused=false;msg('Не получилось прочитать. Снимите ближе, чтобы штрихкод занял полкадра, или введите цифры.');}});
  const found=c=>{if(S0.done)return;haptic('ok');closeScan();lookupBarcode(c);};
  if(!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia)){msg('Камера здесь недоступна — сфотографируйте штрихкод или введите цифры.');return;}
  let stream;try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}},audio:false});}catch(e){msg('Нет доступа к камере. Разрешите доступ или сфотографируйте штрихкод.');return;}
  if(S0.done){stream.getTracks().forEach(t=>t.stop());return;}S0.stream=stream;const v=el.querySelector('video');v.srcObject=stream;try{await v.play();}catch(e){}
  const det=await nativeDetector();
  if(det){msg('Ищу штрихкод…');const loop=async()=>{if(S0.done)return;try{const r=await det.detect(v);if(r&&r[0]&&r[0].rawValue){found(r[0].rawValue);return;}}catch(e){}setTimeout(loop,180);};loop();return;}
  let Z;try{Z=await loadZXing();}catch(e){msg('Не загрузился сканер — сфотографируйте штрихкод или введите цифры.');return;}if(S0.done)return;
  msg('Ищу штрихкод… Держите ровно, чтобы он занял рамку.');let n=0,last='',same=0;
  const crops=[[.1,.3,.8,.4,1280],[0,.2,1,.6,1280],[.2,.35,.6,.3,900],[0,0,1,1,1000]];
  const loop=()=>{if(S0.done)return;if(S0.paused||!v.videoWidth){setTimeout(loop,250);return;}
    const c=zxCanvas(Z,cropTo(v,v.videoWidth,v.videoHeight,...crops[n++%crops.length]));
    if(c){if(/^\d+$/.test(c)&&!eanOk(c)){setTimeout(loop,60);return;}if(c===last)same++;else{last=c;same=1;}if(same>=1){found(c);return;}}
    setTimeout(loop,90);};loop();}
/* ZXing напрямую по кадру на canvas: так надёжнее в iPhone, чем видео-режим библиотеки */
function zxCore(Z){if(zxCore.r)return zxCore.r;const h=new Map();h.set(Z.DecodeHintType.POSSIBLE_FORMATS,[Z.BarcodeFormat.EAN_13,Z.BarcodeFormat.EAN_8,Z.BarcodeFormat.UPC_A,Z.BarcodeFormat.UPC_E,Z.BarcodeFormat.CODE_128,Z.BarcodeFormat.QR_CODE]);h.set(Z.DecodeHintType.TRY_HARDER,true);
  const r=new Z.MultiFormatReader();r.setHints(h);zxCore.r=r;return r;}
function zxCanvas(Z,cv){const r=zxCore(Z);let src;try{src=new Z.HTMLCanvasElementLuminanceSource(cv);}catch(e){return null;}
  for(const B of [Z.HybridBinarizer,Z.GlobalHistogramBinarizer]){try{const x=r.decodeWithState(new Z.BinaryBitmap(new B(src)));if(x)return x.getText();}catch(e){}finally{try{r.reset();}catch(e){}}}return null;}
/* вырезать часть кадра (доли от размеров) и уменьшить до ширины w */
function cropTo(img,iw,ih,fx,fy,fw,fh,w){const sw=iw*fw,sh=ih*fh;const k=Math.min(1,w/sw);const cv=document.createElement('canvas');cv.width=Math.max(1,Math.round(sw*k));cv.height=Math.max(1,Math.round(sh*k));
  const x=cv.getContext('2d',{willReadFrequently:true});x.drawImage(img,iw*fx,ih*fy,sw,sh,0,0,cv.width,cv.height);return cv;}
const eanOk=c=>{if(!/^\d{8}$|^\d{12,13}$/.test(c))return true;const d=c.padStart(13,'0').split('').map(Number);const s=d.slice(0,12).reduce((a,v,i)=>a+v*(i%2?3:1),0);return (10-s%10)%10===d[12];};
async function decodeImage(file){const det=await nativeDetector();
  if(det){try{const bm=await createImageBitmap(file);const r=await det.detect(bm);if(r&&r[0])return r[0].rawValue;}catch(e){}}
  let Z;try{Z=await loadZXing();}catch(e){return null;}
  const url=URL.createObjectURL(file);const img=await new Promise(res=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>res(null);i.src=url;});URL.revokeObjectURL(url);if(!img)return null;
  const iw=img.naturalWidth,ih=img.naturalHeight;
  // от общего к частному: весь кадр, центр, половинки — в разных масштабах
  const tries=[[0,0,1,1,1200],[.2,.3,.6,.4,1200],[.3,.38,.4,.24,1200],[0,.25,1,.5,1600],[.1,.1,.8,.8,1400],[.35,.4,.3,.2,900],[0,0,1,1,800]];
  const T0=Date.now();for(const t of tries){const c=zxCanvas(Z,cropTo(img,iw,ih,...t));if(c)return c;if(Date.now()-T0>9000)break;await new Promise(r=>setTimeout(r,0));}
  return null;}
/* штрихкод не прочитался — просим нейросеть прочитать цифры под ним */

const OFF_F='code,product_name,product_name_ru,generic_name,brands,nutriments,serving_quantity,quantity';
function offMap(p){if(!p)return null;const n=p.nutriments||{};let k=num(n['energy-kcal_100g']);if(k==null&&num(n.energy_100g)!=null)k=num(n.energy_100g)/4.184;
  const per={k:r1(k||0),p:r1(num(n.proteins_100g)||0),f:r1(num(n.fat_100g)||0),c:r1(num(n.carbohydrates_100g)||0)};
  if(k==null&&!per.p&&!per.f&&!per.c)return null;if(k==null)per.k=r1(per.p*4+per.f*9+per.c*4);
  const units=[];const sq=num(p.serving_quantity);if(sq&&sq>0&&sq<2000)units.push({n:'порция',g:r1(sq)});const qq=String(p.quantity||'').match(/(\d+(?:[.,]\d+)?)\s*(kg|кг|g|г|гр|l|л|ml|мл)(?![a-zа-яё])/i);if(qq){const v=num(qq[1])*(/^(kg|кг|l|л)$/i.test(qq[2])?1000:1);if(v&&v<5000&&!units.some(u=>u.g===v))units.push({n:'упаковка',g:v});}

  if((el=t.closest('[data-fu]'))&&FD.amount){const A=FD.amount;const g=amtG();A.u=el.dataset.fu;A.q=A.u==='г'?r0(g||100):Math.max(0.5,r1(g/unitG(A.src,A.u))||1);renderAmount();return;}

  if((el=t.closest('[data-fing]'))&&FD.recipe){const n=+el.dataset.fing;const i=FD.recipe.ings[n];if(!i)return;FD.amount={src:{ref:i.ref,name:i.name,per:i.per,units:i.units||[],kind:'ing'},entry:null,meal:'b',u:i.u||'г',q:i.q||i.g,ing:n};renderAmount();return;}
  if((el=t.closest('[data-fingdel]'))&&FD.recipe){FD.recipe.ings.splice(+el.dataset.fingdel,1);renderRecipe();return;}
  if((el=t.closest('[data-fsaverec]'))){saveRecipe();return;}

  if((el=t.closest('[data-fweek]'))){repWeek=Math.max(0,repWeek+(+el.dataset.fweek));render();return;}

    const p=curP();p.food={act:g.act,goal:g.goal,kcal:num(g.kcal)||'',pp:+g.pp,fp:+g.fp,cp:+g.cp};persist('p',p.id);closeSheet();toast('Цель: '+foodGoal(p).k+' ккал в день.');return;}

const OWN_RE=/^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec\/?$|^http:\/\/127\.0\.0\.1:\d+\/$/;
const SERVER_CODE_URL='https://yradkin.github.io/metrika/server.txt';
function cloudGet(k){return new Promise(res=>{try{if(TGA&&TGA.CloudStorage&&TGA.isVersionAtLeast&&TGA.isVersionAtLeast('6.9'))TGA.CloudStorage.getItem(k,(e,v)=>res(e?null:v||null));else res(null);}catch(e){res(null);}});}
function cloudSet(k,v){try{if(TGA&&TGA.CloudStorage&&TGA.isVersionAtLeast&&TGA.isVersionAtLeast('6.9')){if(v)TGA.CloudStorage.setItem(k,v,()=>{});else TGA.CloudStorage.removeItem(k,()=>{});}}catch(e){}}

  if(SY.ready)return '';
  const e=SY.lastErr||'';const why=e==='auth'?'Сервер не узнал подпись Telegram. Проверьте свойство BOT_TOKEN в Apps Script: это должен быть токен именно этого бота, без пробелов. После исправления развёртывание менять не нужно.':
    (e==='TypeError'||e==='SyntaxError')?'Сервер не отвечает как надо. Проверьте развёртывание: «Веб-приложение», выполнять от имени «Я», доступ «Все». Если меняли код — нужна новая версия развёртывания.':

  if((el=t.closest('[data-dk]'))){docKind=el.dataset.dk;render();return;}
  if((el=t.closest('[data-doc]'))){openDoc(el.dataset.doc);return;}
  if((el=t.closest('[data-editdoc]'))){editDoc(el.dataset.editdoc);return;}
  if((el=t.closest('[data-act]'))){const a=el.dataset.act;
    if(a==='adddoc'){editDoc(null);return;}
    if(a==='ckall'){openCheckups();return;}
    if(a==='mednew'){openMedNew();return;}
    if(a==='nophoto'&&draft&&draft.kind==='prof'){delete draft.p.photo;const x=$('#pf-av');if(x)x.innerHTML=avatar(draft.p,56);el.remove();return;}
    if(a==='tgphoto'&&draft&&draft.kind==='prof'){const u=TGA.initDataUnsafe.user.photo_url;fetch(u).then(r=>r.blob()).then(b=>squareImg(b,192)).then(d=>{draft.p.photo=d;const x=$('#pf-av');if(x)x.innerHTML=avatar(draft.p,56);}).catch(()=>toast('Telegram не отдал фото — загрузите файлом.'));return;}
    if(a==='exportnow'){toast('Обновляю таблицу…');exportReadable(true);return;}
    if(a==='mednames'){openMedNames();return;}
    if(a==='medrename'){doMedRename();return;}
    if(a==='addweight'){const p=curP();const d=$('#vw-d').value||ymd(today()),kg=num($('#vw-kg').value);if(!kg){toast('Введите вес.');return;}wlogAdd(p,d,kg);persist('p',p.id);openIndicator(sheetId||'V_WEIGHT');render();toast('Вес добавлен.');return;}
    if(a==='savedoc'){saveDoc();return;}
    if(a==='deldoc'){const d=draft&&draft.d;if(!d)return;confirmBox({title:'Удалить документ?',text:esc(d.title||'')+' · '+fmtD(d.date)+'. Его можно будет вернуть из корзины.',onOk:()=>{delete st.docs[d.id];persist('d',d.id);draft=null;closeSheet();render();toast('Документ удалён.');}});return;}
    if(a==='addprof')openProfile();
    else if(a==='pickprof')pickProfile();
    else if(a==='addtest')openAdd();
    else if(a==='manual')openReview({items:[],mode:'manual'});
    else if(a==='saveprof'){const p=draft.p;p.name=String(p.name||'').trim();if(!p.name){toast('Введите имя.');return;}
      if(p.dob)p.birth=String(p.dob).slice(0,4);if(p.height!==''&&p.height!=null){p.height=num(p.height);if(p.height&&!p.hDate)p.hDate=ymd(today());}
      if(num(p.wNow))wlogAdd(p,ymd(today()),num(p.wNow));delete p.wNow;st.profiles[p.id]=p;persist('p',p.id);if(draft.isNew)setCur(p.id);draft=null;closeSheet();haptic('ok');}
    else if(a==='delprof'){const p=st.profiles[sheetId];if(!p)return;const n=testsOf(p.id).length;confirmBox({title:'Удалить профиль «'+p.name+'»?',text:n?'Вместе с ним удалятся '+n+' '+plural(n,'анализ','анализа','анализов')+'.':'Профиль пустой.',protect:n>0,onOk:()=>{testsOf(p.id).forEach(t=>{delete st.tests[t.id];persist('a',t.id);});delete st.profiles[p.id];persist('p',p.id);setCur((profList()[0]||{}).id||'');closeSheet();toast('Профиль удалён.');}});}
    else if(a==='rvadd'){const inp=$('#rv-add');const v=(inp.value||'').trim();if(!v)return;const code=matchCode(v)||(CATALOG.find(c=>c[1].toLowerCase()===v.toLowerCase())||[])[0]||null;draft.items.push({id:uid(),code,name:code?CAT[code].name:v,value:'',unit:code?CAT[code].unit:'',lo:'',hi:'',on:true});renderReview();setTimeout(()=>{const ins=sheetIn.querySelectorAll('[data-rf="value"]');const l=ins[ins.length-1];if(l)l.focus();},60);}
    else if(a==='rvsave')saveReview();
    else if(a==='deltest'){const id=draft&&draft.edit;const t=st.tests[id];if(!t)return;confirmBox({title:'Удалить анализ от '+fmtD(t.date)+'?',text:'Показатели из него пропадут из графиков. Вернуть можно из корзины.',onOk:()=>{delete st.tests[id];persist('a',id);draft=null;closeSheet();toast('Анализ удалён.');}});}
    else if(a==='pdf')exportPDF(el);
    else if(a==='changelog')openLog();
    else if(a==='trash')openTrash();
    else if(a==='backups')openBackups();
    else if(a==='reconnect'){SY.lastErr='';toast('Подключаюсь…');syncConnect().then(()=>{if(SY.ready){closeSheet();toast('Сервер подключён.');}else openSettings();});}
    else if(a==='backupnow'){api('backup_now').then(()=>{toast('Копия сохранена.');openBackups();}).catch(()=>toast('Не получилось.'));}
    return;}
});
document.addEventListener('input',e=>{const t=e.target;
  if(t.dataset.indq!==undefined){indQ=t.value;const pos=t.selectionStart;render();const i=$('[data-indq]');if(i){i.focus();try{i.setSelectionRange(pos,pos);}catch(x){}}return;}
  if(draft&&draft.kind==='prof'&&t.dataset.pf){draft.p[t.dataset.pf]=t.value;return;}
  if(draft&&draft.kind==='doc'&&t.dataset.df){draft.d[t.dataset.df]=t.value;return;}
  if(draft&&draft.kind==='review'){if(t.dataset.rv){draft[t.dataset.rv]=t.value;return;}if(t.dataset.rf){const row=t.closest('[data-ri]');const it=draft.items[+row.dataset.ri];it[t.dataset.rf]=t.value;if(t.dataset.rf==='name')it.code=matchCode(t.value);return;}}
});
document.addEventListener('change',e=>{const t=e.target;
  if(t.dataset.pfrom!==undefined||t.dataset.pto!==undefined){if(t.dataset.pfrom!==undefined)indFrom=t.value;else indTo=t.value;if(t.dataset.perind){const sc=sheet.scrollTop;openIndicator(t.dataset.perind);sheet.scrollTop=sc;}render();return;}
  if(draft&&draft.kind==='doc'&&t.dataset.df){draft.d[t.dataset.df]=t.value;return;}
  if(t.dataset.blank!==undefined&&t.files&&t.files[0]){const f=t.files[0];t.value='';handleBlank(f);return;}
  if(t.dataset.pphoto!==undefined&&t.files&&t.files[0]&&draft&&draft.kind==='prof'){const f=t.files[0];t.value='';squareImg(f,192).then(d=>{draft.p.photo=d;const a=$('#pf-av');if(a)a.innerHTML=avatar(draft.p,56);}).catch(()=>toast('Не получилось открыть фото.'));return;}
  if(t.dataset.health!==undefined&&t.files&&t.files[0]){const f=t.files[0];t.value='';importHealth(f);return;}
  if(t.dataset.import!==undefined&&t.files&&t.files[0]){const f=t.files[0];t.value='';importFile(f);return;}
  if(t.dataset.docfile!==undefined&&t.files&&t.files[0]){const f=t.files[0];t.value='';addDocFile(f);return;}
  if(t.dataset.remind){const p=curP();p.remind=p.remind||{};if(t.value)p.remind[t.dataset.remind]=t.value;else delete p.remind[t.dataset.remind];persist('p',p.id);return;}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!closeLb())closeSheet();}if(e.key==='Enter'&&e.target.id==='rv-add'){e.preventDefault();sheetIn.querySelector('[data-act="rvadd"]').click();}});

/* ---------- Старт ---------- */
function crashScreen(err){if(document.getElementById('crash'))return;const el=document.createElement('div');el.id='crash';el.className='modal';
  el.innerHTML='<div class="modal-in"><h3>Что-то пошло не так</h3><p>Данные на сервере в порядке. Перезагрузите. Если не поможет — сбросьте копию на телефоне.</p><p class="small muted" style="word-break:break-word">Код ошибки: '+esc(String(err&&(err.message||err)||'?').slice(0,180))+'</p><div class="row" style="justify-content:flex-end"><button type="button" class="btn" id="crashReset">Сбросить на телефоне</button><button type="button" class="btn primary" id="crashReload">Перезагрузить</button></div></div>';
  document.body.appendChild(el);el.querySelector('#crashReload').onclick=()=>location.reload();
  el.querySelector('#crashReset').onclick=()=>{try{['health-v1','health-pending'].forEach(k=>localStorage.removeItem(k));}catch(e){}location.reload();};}
const _render=render;render=function(){try{_render();}catch(e){crashScreen(e);}};
window.addEventListener('error',e=>{if(e&&e.message&&/Script error/.test(e.message))return;if(!view.innerHTML.trim())crashScreen(e.error||e.message);});
window.__h={get draft(){return draft},get st(){return st},parsePages:pages=>{const pl=pdfPagesToLines(pages);return {items:rowsToItems(pl.lines),date:findDate(pl.head),lab:findLab(pl.head+' '+pages.flat().map(i=>i.s).join(' '))};},parseText:t=>parseOCR(t),lines:pages=>pdfPagesToLines(pages).lines};
try{loadLocal();}catch(e){st=normalize({});}
render();initStore().catch(crashScreen);
})();
</script>
